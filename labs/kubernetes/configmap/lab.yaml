# Three objects in the default namespace; use only in the learning cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-demo-page
data:
  index.html: |
    <!doctype html>
    <html lang="zh-CN">
      <meta charset="UTF-8">
      <title>ConfigMap Lab</title>
      <h1>Hello Kubernetes</h1>
      <p>这段内容来自 ConfigMap。</p>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          volumeMounts:
            - name: page-files
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: page-files
          configMap:
            name: web-demo-page
---
apiVersion: v1
kind: Service
metadata:
  name: web-demo-svc
spec:
  type: ClusterIP
  selector:
    app: web-demo
  ports:
    - port: 80
      targetPort: 80
