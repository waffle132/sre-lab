global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
scrape_configs:
  - job_name: "u-short"
    scrape_interval: 5s
    static_configs:
      - targets: ["u-short:8080"]

  - job_name: "node-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: ["node-exporter:9100"]

rule_files:
  - "alert-rules.yml" 
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]     