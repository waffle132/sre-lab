name: Test, build and deploy u-short
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: get repository code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: test health probe
        working-directory: phase1-server
        run: python test_probe.py

      - name: test bussiness probe
        working-directory: phase1-server
        run: python test_business_probe.py
  build:
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/waffle132/u-short:${{ github.sha }} ./phase1-server

      - name: Push image
        run: docker push ghcr.io/waffle132/u-short:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, sre-deploy]
    timeout-minutes: 10
    concurrency:
      group: u-short-wsl-deployment
      cancel-in-progress: false
    env:
      DEPLOY_IMAGE: ghcr.io/waffle132/u-short:${{ github.sha }}

    steps:
      - name: Pull this commit's image
        run: docker pull "$DEPLOY_IMAGE"

      - name: Deploy and verify
        working-directory: /home/sre/sre-lab/phase1-server
        run: bash deploy.sh "$DEPLOY_IMAGE"

      - name: Confirm deployed version
        run: |
          actual=$(docker inspect u-short --format '{{.Config.Image}}')
          echo "Running image: $actual"
          test "$actual" = "$DEPLOY_IMAGE"
